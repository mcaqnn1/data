services:
  postgres:
    image: postgres:16
    container_name: postgres-data
    environment:
      - POSTGRES_USER=${db_user}
      - POSTGRES_PASSWORD=${db_pass}
      - POSTGRES_DB=${db_name}
    ports:
      - "${db_port}:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-data
    ports:
      - "${server_port}:8080"
    environment:
      - PORT=${server_port}
      - db_host=postgres
      - db_port=5432
      - db_user=${db_user}
      - db_pass=${db_pass}
      - db_name=${db_name}
    depends_on:
    - postgres

    
volumes:
  postgres_data: